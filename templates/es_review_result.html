{% extends "base.html" %}

{% block title %}ES添削結果{% endblock %}

{% block content %}

<h2>✏️ ES添削結果</h2>

<p>
    <a href="{{ url_for('dashboard') }}">
        🏠 ダッシュボードに戻る
    </a>
</p>


<div class="es-info">
    <p><strong>🏢 企業：</strong>{{ company }}</p>
    <p><strong>❓ 設問：</strong>{{ question }}</p>
</div>

<div class="ai-result">
    {{ result }}
</div>

<div class="es-actions">

    <button type="button" onclick="copyReview()">
        📋 添削結果をコピー
    </button>

    <a href="{{ url_for('es_review') }}">
        ✏️ 別のESを添削する
    </a>

</div>

<script>
function copyReview() {

    const text = document.querySelector(".ai-result").innerText;

    navigator.clipboard.writeText(text).then(function() {

        alert("添削結果をコピーしました！");

    });

}
</script>

{% endblock %}
